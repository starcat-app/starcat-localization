name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate localization packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate package contracts and release gates
        run: python3 scripts/validate_packages.py
